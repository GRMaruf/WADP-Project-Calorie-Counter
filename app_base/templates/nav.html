<nav class="cal-nav">

  <!-- Logo -->
  <a href="{% url 'home_page' %}" class="cal-nav-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z" fill="white"/>
      </svg>
    </div>
    CALTRACK
  </a>

  <!-- Nav Links -->
  <ul class="cal-nav-links">
    <li>
      <a href="{% url 'home_page' %}" class="{% if request.resolver_match.url_name == 'home_page' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Home
      </a>
    </li>
    <li>
      <a href="{% url 'dashboard_page' %}" class="{% if request.resolver_match.url_name == 'dashboard_page' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
        Dashboard
      </a>
    </li>
    <li>
      <a href="{% url 'profile_page' %}" class="{% if request.resolver_match.url_name == 'profile_page' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
        Profile
      </a>
    </li>
  </ul>

  <div class="nav-divider"></div>

  <!-- User Pill -->
  <div class="nav-user">
    <span class="nav-username">{{ request.user.username }}</span>
    <div class="nav-avatar">{{ request.user.profile.name|slice:":2"|upper|default:request.user.username|slice:":2"|upper }}</div>
  </div>

  <div style="width: 8px;"></div>

  <!-- Login / Logout -->
  {% if user.is_authenticated %}
    <a href="{% url 'logout_page' %}" class="nav-logout">
      <svg viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px;">
        <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
      </svg>
      Logout
    </a>
  {% else %}
    <a href="{% url 'login_page' %}" class="btn-primary-cal">Login</a>
  {% endif %}

</nav>

<!-- Nav Styles -->
<style>
  .cal-nav {
    background: var(--clr-surface);
    border-bottom: 1px solid var(--clr-border);
    height: var(--nav-height);
    display: flex;
    align-items: center;
    padding: 0 2rem;
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 0;
    z-index: 1000;
    gap: 4px;
  }

  .cal-nav-logo {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(90deg, var(--clr-lime), var(--clr-orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-decoration: none;
    margin-right: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--clr-lime), var(--clr-orange));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo-icon svg { width: 18px; height: 18px; }

  .cal-nav-links {
    display: flex;
    align-items: center;
    gap: 4px;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .cal-nav-links a {
    font-size: 14px;
    font-weight: 500;
    color: var(--clr-text-sec);
    text-decoration: none;
    padding: 7px 14px;
    border-radius: var(--radius-pill);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all var(--transition);
  }

  .cal-nav-links a svg { width: 15px; height: 15px; opacity: 0.7; }

  .cal-nav-links a:hover,
  .cal-nav-links a.active {
    background: var(--clr-lime-light);
    color: var(--clr-lime-dark);
    font-weight: 600;
  }

  .cal-nav-links a.active svg { opacity: 1; }

  .nav-divider {
    width: 1px;
    height: 22px;
    background: var(--clr-border);
    margin: 0 8px;
  }

  .nav-user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 5px 5px 14px;
    border: 1px solid var(--clr-border);
    border-radius: var(--radius-pill);
    cursor: default;
    transition: all var(--transition);
    background: var(--clr-surface);
  }

  .nav-user:hover {
    border-color: var(--clr-lime);
    box-shadow: 0 2px 8px rgba(122, 191, 16, 0.12);
  }

  .nav-username {
    font-size: 13px;
    font-weight: 600;
    color: var(--clr-text);
  }

  .nav-avatar {
    width: 30px;
    height: 30px;
    background: linear-gradient(135deg, var(--clr-lime), var(--clr-orange));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    font-family: var(--font-display);
    letter-spacing: 0.5px;
  }

  .nav-logout {
    font-size: 13px;
    font-weight: 600;
    color: var(--clr-coral);
    text-decoration: none;
    padding: 7px 16px;
    border-radius: var(--radius-pill);
    border: 1px solid rgba(232, 64, 64, 0.2);
    background: var(--clr-coral-light);
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .nav-logout:hover {
    background: var(--clr-coral);
    color: #fff;
    border-color: var(--clr-coral);
  }

  /* ── Mobile ───────────────────────────────────── */
  @media (max-width: 768px) {
    .cal-nav { padding: 0 1rem; }
    .cal-nav-links { display: none; }
    .nav-divider { display: none; }
    .nav-username { display: none; }
  }
